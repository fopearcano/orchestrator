<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Storyline — Timeline Plotter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <button class="brand brand-button" id="projectsToggle" aria-label="Open projects">
      <span class="brand-mark"><i></i><i></i><i></i></span>
      <span>storyline</span>
    </button>
    <div class="project-name">
      <span class="status-dot"></span>
      <input value="The Last Signal" aria-label="Project title">
      <span class="saved">Saved just now</span>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="4"/></svg>
      </button>
      <button class="icon-btn" id="settingsToggle" aria-label="Open settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"/></svg></button>
    </div>
  </header>

  <aside class="projects-drawer" id="projectsDrawer" aria-hidden="true">
    <div class="drawer-head"><strong>Projects</strong><button id="projectsClose">×</button></div>
    <button class="primary-action" id="newProject">＋ New project</button>
    <div class="project-card active"><span class="project-dot"></span><div><strong>The Last Signal</strong><small>Current project</small></div></div>
    <div class="drawer-label">FILE</div>
    <button class="drawer-action" id="saveFile">⇩ Save project file</button>
    <label class="drawer-action file-action">⇧ Open project file<input id="openFile" type="file" accept=".storyline,.json"></label>
  </aside>
  <div class="drawer-scrim" id="drawerScrim"></div>

  <aside class="settings-panel" id="settingsPanel" aria-hidden="true">
    <div class="drawer-head"><strong>Settings</strong><button id="settingsClose">×</button></div>
    <label class="settings-row"><span>Time scale<small>Labels across the canvas</small></span><select id="timeUnit"><option value="hours">Hours</option><option value="days">Days</option><option value="months">Months</option></select></label>
    <label class="settings-row"><span>Theme<small>Interface appearance</small></span><select id="themeSelect"><option value="light">Light</option><option value="dark">Dark</option><option value="custom">Custom</option></select></label>
    <div class="custom-theme" id="customThemeControls" hidden>
      <label>Canvas<input type="color" id="customBg" value="#f4f2ed"></label>
      <label>Panels<input type="color" id="customPanel" value="#fbfaf7"></label>
      <label>Text<input type="color" id="customInk" value="#252724"></label>
      <label>Accent<input type="color" id="customAccent" value="#e56745"></label>
    </div>
    <label class="settings-row"><span>Grid<small>Show canvas grid</small></span><input id="gridToggle" type="checkbox" checked></label>
  </aside>

  <div class="structure-menu" id="structureMenu" hidden>
    <div class="structure-menu-head"><strong>Structure point</strong><button id="structureMenuClose" aria-label="Close">×</button></div>
    <label>Label<input id="structureLabelInput"></label>
    <label>Color<input id="structureColorInput" type="color" value="#e56745"></label>
    <label>Position<input id="structureTimeInput" type="number" step="0.01"></label>
    <button id="structurePointApply">Apply changes</button>
    <button class="danger" id="structurePointDelete">Delete point</button>
  </div>

  <main class="workspace">
    <button class="panel-toggle left-toggle" id="leftPanelToggle" aria-label="Hide timelines panel" title="Hide timelines panel">‹</button>
    <aside class="sidebar">
      <section>
        <div class="section-head"><span>TIMELINES</span><span class="count" id="timelineCount">3</span></div>
        <div id="timelineList"></div>
        <button class="add-row" id="addTimeline"><span>＋</span> Add timeline</button>
        <div class="timeline-menu" id="timelineMenu" hidden>
          <div class="timeline-menu-head"><strong>Edit timeline</strong><button id="timelineMenuClose" aria-label="Close">×</button></div>
          <label>Name<input id="timelineNameInput"></label>
          <label>Color<input id="timelineColorInput" type="color"></label>
          <div class="timeline-menu-grid">
            <label>Stroke<select id="timelineWidthInput"><option value="1">1 px</option><option value="2">2 px</option><option value="3">3 px</option><option value="4">4 px</option><option value="6">6 px</option><option value="8">8 px</option><option value="10">10 px</option><option value="12">12 px</option><option value="16">16 px</option><option value="20">20 px</option><option value="24">24 px</option><option value="30">30 px</option></select></label>
            <label>Opacity<input id="timelineOpacityInput" type="number" min="0" max="100" step="5"></label>
          </div>
          <label>Line style<select id="timelineDashInput"><option value="solid">Solid</option><option value="dashed">Dashed</option></select></label>
          <button class="timeline-save" id="timelineSave">Apply changes</button>
          <button class="timeline-delete" id="timelineDelete">Delete timeline</button>
        </div>
      </section>
      <section class="layers-section">
        <div class="section-head"><span>LAYERS</span></div>
        <button class="layer-row" id="eventsLayer"><span class="eye">◉</span><span class="layer-icon">┋</span>Events <em id="eventCount">4</em></button>
        <button class="layer-row" id="notesLayer"><span class="eye">◉</span><span class="layer-icon">T</span>Notes <em id="noteCount">2</em></button>
        <button class="layer-row" id="gridLayer"><span class="eye">◉</span><span class="layer-icon">⌗</span>Grid</button>
      </section>
    </aside>

    <section class="canvas-shell" id="canvasShell">
      <div class="floating-tools">
        <button class="toolbar-grip" id="toolbarGrip" aria-label="Move toolbar" title="Drag toolbar">⠿</button>
        <button class="tool active" data-tool="pan" title="Pan"><svg viewBox="0 0 24 24"><path d="M8 11V7a1.5 1.5 0 0 1 3 0v3-5a1.5 1.5 0 0 1 3 0v5-3a1.5 1.5 0 0 1 3 0v4-2a1.5 1.5 0 0 1 3 0v4c0 5-3 8-8 8-3 0-5-2-7-5l-2-3a1.6 1.6 0 0 1 2.5-2z"/></svg></button>
        <button class="tool" data-tool="event" title="Add event"><svg viewBox="0 0 24 24"><path d="M12 4v16M7 8h10M8 17h8"/></svg></button>
        <button class="tool" data-tool="note" title="Add note"><b>T</b></button>
        <span></span>
        <button class="tool spread-tool" id="spreadProject" title="Spread project laterally" aria-label="Spread project laterally">↔</button>
        <div class="spread-control" id="spreadControl" hidden><input id="spreadRange" type="range" min="0.5" max="8" step="0.01" value="1" aria-label="Horizontal project spread"><output id="spreadValue">100%</output></div>
        <button class="tool" id="undoButton" title="Undo" aria-label="Undo" disabled>↶</button>
      </div>
      <div class="zoom-controls"><button id="zoomOut">−</button><span id="zoomLabel">100%</span><button id="zoomIn">＋</button><button id="fitView">⌗</button></div>
      <div class="canvas" id="canvas">
        <div class="world" id="world">
          <div class="time-zero-line" aria-label="Chronological time zero"></div>
          <div class="ruler" id="ruler"><i class="playhead"></i></div>
          <div class="chronological-label">CHRONOLOGICAL TIMELINE</div>
          <div id="lines"></div>
          <svg class="diegetic-connections" id="diegeticConnections" aria-label="Diegetic event connections"></svg>
          <div id="events"></div>
          <div id="notes"></div>
          <div class="diegetic-axis" id="diegeticAxis"><span>DIEGETIC TIMELINE</span></div>
          <div class="structure-points" id="structurePoints"></div>
        </div>
      </div>
    </section>

    <button class="panel-toggle right-toggle" id="rightPanelToggle" aria-label="Hide inspector panel" title="Hide inspector panel">›</button>
    <aside class="inspector" id="inspector">
      <div class="inspector-title"><span id="inspectKind">EVENT</span><button id="closeInspector">×</button></div>
      <div class="field"><label>Label</label><input id="labelInput" value="First contact"></div>
      <div class="field"><label>Description</label><textarea id="descriptionInput" rows="4" placeholder="Describe what happens at this event…"></textarea></div>
      <div class="field"><label>Timeline</label><select id="timelineSelect"><option>Main plot</option><option>Dr. Vale</option><option>Echo signal</option></select></div>
      <div class="field-grid"><div class="field"><label id="positionLabel">Day</label><input id="dayInput" type="number" step="0.01" value="8"></div><div class="field"><label>Time</label><input id="eventTimeInput" type="time" value="14:30"></div></div>
      <div class="divider"></div>
      <div class="subhead">APPEARANCE</div>
      <div class="field"><label>Color</label><div class="color-field"><input id="colorInput" type="color" value="#e56745"><span>#E56745</span></div></div>
      <div class="field-grid"><div class="field"><label>Line</label><select id="dashInput"><option>Solid</option><option>Dashed</option><option>Dotted</option></select></div><div class="field"><label>Opacity</label><input id="opacityInput" value="100%"></div></div>
      <div class="field-grid"><div class="field"><label>Font</label><select id="fontInput"><option value="Manrope">Manrope</option><option value="DM Mono">Mono</option></select></div><div class="field"><label>Size</label><select id="fontSizeInput"><option value="13">13 px</option><option value="15">15 px</option><option value="18">18 px</option></select></div></div>
      <div class="text-style-controls"><label><input id="boldInput" type="checkbox"><strong>B</strong> Bold</label><label><input id="italicInput" type="checkbox"><em>I</em> Italic</label></div>
      <div class="divider"></div>
      <div class="subhead">DIEGETIC CONNECTION</div>
      <p class="field-help">Connect this event to its perceived position in story time.</p>
      <button class="diegetic-btn" id="toggleDiegetic">Add diegetic line</button>
      <div class="field"><label>Structure template</label><select id="structureTemplate"><option value="none">None</option><option value="three-act">Three-act structure</option><option value="hero">Hero’s journey</option><option value="save-cat">Save the Cat</option><option value="custom">Custom</option></select></div>
      <button class="diegetic-btn secondary" id="addStructurePoint">＋ Add structure point</button>
      <button class="delete-btn" id="deleteEvent">Delete event</button>
    </aside>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
